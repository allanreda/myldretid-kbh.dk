name: Deploy Prod Site

on:
  push:
    branches: 
      - main
    paths:
      - 'website/website/**'
      - '.github/workflows/firebase.deploy.prod.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - run: npm install -g firebase-tools

      - run: |
          cd website/website
          # Copy the robots file
          cp robots.prod.txt robots.txt

      - run: firebase deploy --only hosting:prod --token "${{ secrets.FIREBASE_DEPLOY_TOKEN }}"
        working-directory: website/website
